name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # Collect assets
          assets="main.js manifest.json"
          if [ -f styles.css ]; then
            assets="$assets styles.css"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            # The release already exists - for example when a tag is moved to a
            # rewritten commit. Replace the assets and keep the release notes
            # instead of failing.
            gh release upload "$tag" $assets --clobber
          else
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              $assets
          fi
